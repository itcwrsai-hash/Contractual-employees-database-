{% extends "base.html" %}
{% block title %}First-time setup{% endblock %}
{% block content %}
<div class="auth">
  <div class="card">
    <div class="logo">{{ icon('train', 28) }}</div>
    <h1>First-time setup</h1>
    <p class="sub">{{ APP_NAME }}<br>Create the administrator account for this system.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <p><label>Username</label><input type="text" name="username" required autofocus autocomplete="username"></p>
      <p><label>Password (min 6 characters)</label><input type="password" name="password" required minlength="6" autocomplete="new-password"></p>
      <p><label>Confirm password</label><input type="password" name="confirm" required minlength="6" autocomplete="new-password"></p>
      <button class="btn">Create admin account</button>
    </form>
    <div class="org-line">Developed by {{ DEVELOPED_BY }}</div>
  </div>
</div>
{% endblock %}
